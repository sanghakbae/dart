name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 단계의 if: 에서는 secrets 컨텍스트를 쓸 수 없다(허용 목록에 없어 빈 값으로 평가된다).
    # 그래서 job 환경변수로 한 번 올려놓고 env 로 판정한다.
    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Firebase 웹 config 는 클라이언트 번들에 실리는 공개 값이라 src/firebase.js 에
      # 기본값으로 내장되어 있다. 별도 주입이 필요 없다.
      #
      # DART·국민연금 조회는 정적 호스팅에서 처리할 수 없어 Cloudflare Worker 를 거친다.
      # 저장소 Variables 에 PROXY_BASE 를 넣어야 배포본에서 동작한다.
      #   Settings → Secrets and variables → Actions → Variables → PROXY_BASE
      #   예: https://dart-proxy.<계정>.workers.dev
      # 기업 검색용 색인(12만 건, 3.6MB). 생성물이라 저장소에 두지 않고 배포 때 굽는다.
      # DART_API_KEY 시크릿이 없으면 건너뛴다 — 그 경우 배포본에서 기업 검색만 안 되고
      # 파일 업로드·분석은 그대로 동작한다.
      # 색인은 기업 검색에만 쓰인다. opendart 가 러너 IP 를 끊어 실패하더라도
      # 배포 전체를 막지 않는다(스크립트도 실패 시 0 으로 끝내지만 이중으로 막아 둔다).
      - name: Build DART corp index
        if: env.DART_API_KEY != ''
        continue-on-error: true
        run: npm run build:corp

      - name: Build
        run: npm run build
        env:
          VITE_PROXY_BASE: ${{ vars.PROXY_BASE }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
