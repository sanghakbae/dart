name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Firebase 웹 config 는 클라이언트 번들에 실리는 공개 값이라 src/firebase.js 에
      # 기본값으로 내장되어 있다. 별도 주입이 필요 없다.
      #
      # DART·국민연금 조회는 정적 호스팅에서 처리할 수 없어 Cloudflare Worker 를 거친다.
      # 저장소 Variables 에 PROXY_BASE 를 넣어야 배포본에서 동작한다.
      #   Settings → Secrets and variables → Actions → Variables → PROXY_BASE
      #   예: https://dart-proxy.<계정>.workers.dev
      - name: Build
        run: npm run build
        env:
          VITE_PROXY_BASE: ${{ vars.PROXY_BASE }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
