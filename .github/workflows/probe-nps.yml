# 국민연금(data.go.kr) 이 어느 출구를 받아주는지 확인하는 일회성 점검.
#
# Cloudflare Worker 에서는 즉시 거절당하고 국내 회선에서는 6.5초 걸려 200 이다.
# "Cloudflare 만 막힌 것인가, 해외 데이터센터 전부인가" 를 가려야 대안을 고를 수 있어
# GitHub 러너(해외 IP)에서 같은 호출을 해 본다. 결과를 보고 지우면 된다.
name: Probe NPS egress

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Call 국민연금 API
        env:
          NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
        run: |
          echo "러너 위치:"; curl -s -m 20 https://ipinfo.io/json | grep -E '"country"|"org"' || true
          echo "--- 국민연금 호출 ---"
          code=$(curl -s -m 60 -o /tmp/out.txt -w '%{http_code} %{time_total}' -G \
            "https://apis.data.go.kr/B552015/NpsBplcInfoInqireServiceV2/getBassInfoSearchV2" \
            --data-urlencode "serviceKey=$NPS_API_KEY" \
            -d "dataType=json&pageNo=1&numOfRows=1&wkpl_nm=%EB%AC%B4%ED%95%98%EC%9C%A0" || echo "연결실패")
          echo "HTTP/시간: $code"
          echo "본문 앞부분:"; head -c 300 /tmp/out.txt | sed 's/[A-Za-z0-9%+/=]\{40,\}/<KEY>/g'
